Builds:
  - versionName: 1.0.1
    versionCode: 11001
    commit: 3c9201cbb2530bb5c3c57e296d81f65b7b45b010
    subdir: app
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/linux
      - app/macos
      - app/windows
    prebuild:
      - sed -i -e 's/compileSdk = 37 .*/compileSdk { version = release(37) { minorApiLevel
        = 0 } }/' android/app/build.gradle.kts
      - flutterVersion=$(sed -n -E 's/^ *FLUTTER_VERSION:[ ]*"?([0-9.]+)"?.*/\1/p'
        ../.github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/compileSdk = 37/compileSdk { version = release(37) { minorApiLevel
        = 0 } }/' $PUB_CACHE/hosted/pub.dev/permission_handler_android-*/android/build.gradle.kts
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

