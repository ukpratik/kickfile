# SPDX-License-Identifier: GPL-3.0-or-later
# On a vX.Y.Z tag: builds the desktop apps and attaches them to a draft GitHub release.
# Android APKs are signed with the release key, which never leaves the maintainer's machine:
# build and upload them by hand (docs/RELEASING.md). Publish the draft when everything is attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z)
        required: true
      only:
        description: "all = every desktop asset; windows-installer = add just the installer to an existing release"
        type: choice
        options: [all, windows-installer]
        default: all

env:
  FLUTTER_VERSION: 3.47.5
  TAG: ${{ inputs.tag || github.ref_name }}
  ONLY: ${{ inputs.only || 'all' }}

defaults:
  run:
    working-directory: app

jobs:
  macos:
    if: (inputs.only || 'all') == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - run: codesign -v --deep --strict build/macos/Build/Products/Release/kickFile.app
      - name: Package DMG
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/kickFile.app dmg/
          ln -s /Applications dmg/Applications
          cp ../.github/macos-first-open.txt "dmg/First open.txt"
          hdiutil create -volname kickFile -srcfolder dmg -ov -format UDZO kickFile-macos.dmg
          hdiutil verify kickFile-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/kickFile-macos.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Packaging scripts come from the workflow's branch, so older tags can get new packages.
      - uses: actions/checkout@v4
        with:
          path: tools-src
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Package zip and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/kickFile, dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* out/kickFile/
          # App-local Visual C++ runtime, so kickFile starts on a fresh Windows.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item "$env:WINDIR\System32\$dll" out/kickFile/ }
          if ($env:ONLY -eq 'all') { Compress-Archive -Path out/kickFile -DestinationPath dist/kickFile-windows-x64.zip }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)\+').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DSourceDir=$PWD\out\kickFile" "/DOutputDir=$PWD\dist" "$env:GITHUB_WORKSPACE\tools-src\app\windows\installer\kickfile.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Installer smoke test
        shell: pwsh
        run: |
          Start-Process dist/kickFile-windows-x64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\kickFile\kickfile.exe"
          if (!(Test-Path $exe)) { throw "not installed: $exe" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\kickFile.lnk")) { throw "no Start menu shortcut" }
          Start-Process "$env:LOCALAPPDATA\Programs\kickFile\unins000.exe" -ArgumentList '/VERYSILENT' -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw "uninstall left the app behind" }
          Write-Host "install + uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*

  linux:
    if: (inputs.only || 'all') == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          cp -R build/linux/x64/release/bundle kickFile
          tar -czf kickFile-linux-x64.tar.gz kickFile
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/kickFile-linux-x64.tar.gz

  draft:
    needs: [macos, windows, linux]
    # In installer-only mode macOS and Linux are skipped; everything that ran must have passed.
    if: always() && needs.windows.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist && if [ "$ONLY" = all ]; then sha256sum * > SHA256SUMS-desktop.txt; else sha256sum * > SHA256SUMS-windows-installer.txt; fi && cd ..
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "kickFile ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* --clobber
