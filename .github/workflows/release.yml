# SPDX-License-Identifier: GPL-3.0-or-later
# On a vX.Y.Z tag: builds the desktop apps and attaches them to a draft GitHub release.
# Android APKs are signed with the release key, which never leaves the maintainer's machine:
# build and upload them by hand (docs/RELEASING.md). Publish the draft when everything is attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z)
        required: true

env:
  FLUTTER_VERSION: 3.47.5
  TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    working-directory: app

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - run: codesign -v --deep --strict build/macos/Build/Products/Release/kickFile.app
      - name: Package DMG
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/kickFile.app dmg/
          ln -s /Applications dmg/Applications
          cp ../.github/macos-first-open.txt "dmg/First open.txt"
          hdiutil create -volname kickFile -srcfolder dmg -ov -format UDZO kickFile-macos.dmg
          hdiutil verify kickFile-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/kickFile-macos.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/kickFile | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* out/kickFile/
          Compress-Archive -Path out/kickFile -DestinationPath kickFile-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/kickFile-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          cp -R build/linux/x64/release/bundle kickFile
          tar -czf kickFile-linux-x64.tar.gz kickFile
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/kickFile-linux-x64.tar.gz

  draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist && sha256sum * > SHA256SUMS-desktop.txt && cd ..
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "kickFile ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* --clobber
