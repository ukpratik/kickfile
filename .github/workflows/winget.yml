# Validates the winget manifests in packaging/winget and installs kickFile from them on a clean runner.
name: winget manifests

on:
  push:
    paths: ["packaging/winget/**", ".github/workflows/winget.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate, install, uninstall
        shell: pwsh
        run: |
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          $dir = Get-ChildItem -Directory -Recurse packaging/winget/manifests | Where-Object { Test-Path "$($_.FullName)/*.installer.yaml" } | Sort-Object FullName | Select-Object -Last 1
          winget validate --manifest $dir.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget install --manifest $dir.FullName --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\kickFile\kickfile.exe")) { throw "kickfile.exe not installed" }
          winget list --id ukpratik.kickFile --disable-interactivity
          winget uninstall --manifest $dir.FullName --silent --disable-interactivity
          Write-Host "winget validate + install + uninstall OK"
