# SPDX-License-Identifier: GPL-3.0-or-later
# Validates the winget manifests in packaging/winget and installs kickFile from them on a clean runner.
name: winget manifests

on:
  push:
    paths: ["packaging/winget/**", ".github/workflows/winget.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Get winget
        timeout-minutes: 10
        run: |
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          winget source remove msstore --disable-interactivity 2>$null
          "MANIFEST=$((Get-ChildItem -Directory -Recurse packaging/winget/manifests | Where-Object { Test-Path "$($_.FullName)/*.installer.yaml" } | Sort-Object FullName | Select-Object -Last 1).FullName)" >> $env:GITHUB_ENV
      - name: Validate
        timeout-minutes: 5
        run: winget validate --manifest $env:MANIFEST --disable-interactivity
      - name: Install, check, uninstall
        timeout-minutes: 10
        run: |
          winget install --manifest $env:MANIFEST --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\kickFile\kickfile.exe")) { throw "kickfile.exe not installed" }
          Start-Process "$env:LOCALAPPDATA\Programs\kickFile\unins000.exe" -ArgumentList '/VERYSILENT' -Wait
          Write-Host "winget validate + install + uninstall OK"
