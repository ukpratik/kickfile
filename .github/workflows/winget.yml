# Validates the winget manifests in packaging/winget. (winget install hangs on GitHub's runners; the
# installer itself is install/uninstall-tested in release.yml, and winget-pkgs' pipeline installs it too.)
name: winget manifests

on:
  push:
    paths: ["packaging/winget/**", ".github/workflows/winget.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Get winget
        timeout-minutes: 10
        run: |
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          winget source remove msstore --disable-interactivity 2>$null
          "MANIFEST=$((Get-ChildItem -Directory -Recurse packaging/winget/manifests | Where-Object { Test-Path "$($_.FullName)/*.installer.yaml" } | Sort-Object FullName | Select-Object -Last 1).FullName)" >> $env:GITHUB_ENV
      - name: Validate
        timeout-minutes: 5
        run: winget validate --manifest $env:MANIFEST --disable-interactivity
