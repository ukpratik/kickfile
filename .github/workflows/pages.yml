# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes site/ (download page + privacy policy) to https://ukpratik.github.io/kickfile/.
# Needs a public repo (on a free plan) and Settings → Pages → Source: GitHub Actions.
# Run manually (Actions → Pages → Run workflow). To publish on every change to site/, add
#   push: { branches: [main], paths: ["site/**", ".github/workflows/pages.yml"] }
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
