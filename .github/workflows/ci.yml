name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (debug APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kickfile-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: kickfile-linux-x64
          path: app/build/linux/x64/release/bundle
          retention-days: 7

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: kickfile-windows-x64
          path: app/build/windows/x64/runner/Release
          retention-days: 7

  macos:
    name: macOS
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      # Fail here, not on the tester's Mac, if the bundle or its ad-hoc signature is broken.
      - run: codesign -v --deep --strict build/macos/Build/Products/Release/kickFile.app
      # A DMG keeps the bundle intact (framework symlinks) through the artifact zip.
      # Test builds are ad-hoc signed: Gatekeeper asks once (see "First open" in the DMG).
      # Developer ID signing and notarisation come with the release builds (Phase 8, A-18).
      - name: Package DMG
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/kickFile.app dmg/
          ln -s /Applications dmg/Applications
          cp ../.github/macos-first-open.txt "dmg/First open.txt"
          hdiutil create -volname kickFile -srcfolder dmg -ov -format UDZO kickFile-macos.dmg
          hdiutil verify kickFile-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: kickfile-macos
          path: app/kickFile-macos.dmg
          retention-days: 7
